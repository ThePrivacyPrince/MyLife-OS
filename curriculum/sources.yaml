# Library. Only sources known to exist. Papers are cited (authors, year, title, venue) without guessed links -
# find them on Google Scholar or your library. Web links are limited to official, stable domains (tested).
# level: intro | core | advanced | research
sources:
  # ---------------- Money & Ownership
  - {key: shah2012, type: paper, level: research, authors: "Shah, A. K., Mullainathan, S., & Shafir, E.", year: 2012,
     title: "Some Consequences of Having Too Little", venue: "Science, 338(6107)",
     why: "Scarcity changes where attention goes - why money stress makes planning harder, and how systems help."}
  - {key: lusardi2014, type: paper, level: research, authors: "Lusardi, A., & Mitchell, O. S.", year: 2014,
     title: "The Economic Importance of Financial Literacy: Theory and Evidence", venue: "Journal of Economic Literature, 52(1)",
     why: "The research case that financial knowledge changes outcomes."}
  - {key: thaler2004, type: paper, level: research, authors: "Thaler, R. H., & Benartzi, S.", year: 2004,
     title: "Save More Tomorrow: Using Behavioral Economics to Increase Employee Saving", venue: "Journal of Political Economy, 112(S1)",
     why: "Automatic, pre-committed saving beats willpower - the idea behind the paycheck split."}
  - {key: amar2011, type: paper, level: research, authors: "Amar, M., Ariely, D., Ayal, S., Cryder, C. E., & Rick, S. I.", year: 2011,
