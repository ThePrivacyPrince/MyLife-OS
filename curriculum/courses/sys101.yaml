course: SYS101
units:
  - key: SYS101-U1
    title: "Python for operators: data in, answers out"
    mode: studio
    weeks: "1-3"
    objectives:
      - Read a CSV file and summarize it in Python
      - Write a function and a test for it
      - Run your code from the command line
    sources: [sweigart, cs50p, py_tutorial]
    learn: >-
      Start with a real file: your bookings. Read it, group it, total it. Then write a test that proves the totals are
      right. A control that isn't tested is a hope, not a control.
    key_points:
      - Read data with the csv module (or pandas later)
      - Functions take input and return output
      - Tests prove the code does what you claim
      - Run it the same way every time
    apply: "Write bookings_report.py: read a bookings CSV (date, ski, revenue) and print bookings and revenue per ski."
    deliverable: "The script runs on a real or sample file and a pytest test for it passes."
    control: "Accurate records of business revenue (ISO 27001 A.5.33 protection of records; SOC 2 processing integrity)."
    quiz:
      - q: "What does a passing test give you that 'it looked right when I ran it' doesn't?"
        type: short
        key_points: ["repeatable proof", "catches breakage when code changes", "evidence for a control"]
  - key: SYS101-U2
    title: "APIs and JSON: get data from the world"
    mode: studio
    weeks: "4-6"
    objectives:
      - Explain HTTP requests, responses and status codes
      - Call a public API and parse JSON
      - Handle errors and rate limits safely
    sources: [mdn_http, requests_docs, nws_api]
    learn: >-
      An API is a contract: send a request, get a structured response. The National Weather Service API is free and
      asks you to identify your app with a User-Agent header. Check the status code before trusting the body.
    key_points:
      - Request = method + URL + headers (+ body)
      - Status codes: 2xx ok, 4xx your problem, 5xx their problem
      - JSON is nested keys and lists
      - Never assume the call succeeded
    apply: "Write go_no_go.py: get the forecast for your launch area and flag rental days with high wind or storms."
    deliverable: "The script runs and prints a go/no-go list for the next days; it handles a failed request without crashing."
    control: "Operational safety and availability - a documented, repeatable weather decision (ISO 27001 A.5.30 ICT readiness / SOC 2 availability)."
    quiz:
      - q: "An API returns status 429. What does it mean?"
        choices: ["Success", "Not found", "Too many requests - slow down", "Server error"]
        answer: 2
        why: "429 Too Many Requests: you hit a rate limit; wait and retry."
      - q: "Which HTTP method is NOT idempotent?"
        choices: ["GET", "PUT", "DELETE", "POST"]
        answer: 3
        why: "Repeating a POST can create duplicates; GET, PUT and DELETE have the same effect when repeated."
  - key: SYS101-U3
    title: "Controls as code: OPA and Rego"
    mode: studio
    weeks: "7-9"
    objectives:
      - Write a Rego policy that denies an unsafe action
      - Test the policy with opa test
      - Explain least privilege and fail-safe defaults
    sources: [opa_docs, saltzer1975, nist_csf2]
    learn: >-
      Policy as code turns a rule ("no waiver, no ride") into something a machine enforces and an auditor can test.
      Rego evaluates JSON input against rules. Saltzer & Schroeder's fail-safe defaults: deny unless explicitly allowed.
    key_points:
      - Policy as code = rules a machine enforces and tests
      - Rego evaluates the input document
      - Default deny (fail-safe defaults)
      - Tests are the evidence
    apply: >-
      Write booking.rego: deny a booking if there's no signed waiver, the renter is under your minimum age, or the
      ski isn't marked inspected. Write booking_test.rego with passing and failing cases.
    deliverable: "opa test passes, including a test proving a booking without a waiver is denied."
    control: "Authorization and safety rules enforced automatically (SOC 2 CC6.1 logical access; ISO 27001 A.5.15 access control)."
    quiz:
      - q: "'Fail-safe defaults' (Saltzer & Schroeder) means…"
        choices: ["Allow unless something is wrong", "Deny unless explicitly allowed", "Log everything", "Encrypt everything"]
        answer: 1
        why: "Access decisions should default to denial; permissions are granted explicitly."
  - key: SYS101-U4
    title: "Infrastructure as code: Terraform with a policy check"
    mode: studio
    weeks: "10-12"
    objectives:
      - Run terraform init, plan and apply
      - Explain state, providers and drift
      - Check a Terraform plan against a Rego policy before applying
    sources: [tf_tutorials, morris_iac, opa_docs]
    learn: >-
      Terraform describes infrastructure in files and makes reality match. The plan shows what will change;
      'terraform show -json' turns it into input a policy can check - so an unencrypted bucket is blocked before it
      exists. That's the GRC-engineer move: the control runs in the pipeline, not in a spreadsheet.
    key_points:
      - init -> plan -> apply
      - State tracks what Terraform manages; drift is reality diverging
      - Plans can be checked by policy before apply
      - Prevention beats detection
    apply: >-
      Define storage for booking data with encryption on, export the plan as JSON, and write a Rego rule that fails
      any plan creating unencrypted storage. Show one passing plan and one deliberately failing plan.
    deliverable: "A good plan passes the policy and a broken plan is blocked - both captured as evidence."
    control: "Encryption of data at rest enforced before deployment (ISO 27001 A.8.24 use of cryptography; SOC 2 CC6.1)."
    quiz:
      - q: "What does a Terraform state file do?"
        choices: ["Stores your passwords", "Tracks the real resources Terraform manages", "Holds the provider code",
                  "Lists your team members"]
        answer: 1
        why: "State maps your configuration to real resources so Terraform knows what to change."
      - q: "Why check the plan with policy before apply?"
        choices: ["It's faster to write", "It prevents a non-compliant resource from ever existing",
                  "Terraform requires it", "It replaces testing"]
        answer: 1
        why: "Preventive controls stop the problem before it happens; detective ones find it afterwards."
cards:
  - {unit: SYS101-U1, kind: definition, term: "Function", definition: "A named block of code that takes input and returns output."}
  - {unit: SYS101-U1, kind: definition, term: "Unit test", definition: "Code that checks a small piece of your program gives the expected result."}
  - {unit: SYS101-U1, kind: acronym, term: "CSV", definition: "Comma-Separated Values - a plain-text table format."}
  - {unit: SYS101-U2, kind: acronym, term: "API", definition: "Application Programming Interface - a defined way for programs to request data or actions."}
  - {unit: SYS101-U2, kind: acronym, term: "JSON", definition: "JavaScript Object Notation - a text format of keys, values and lists used by most APIs."}
  - {unit: SYS101-U2, kind: acronym, term: "REST", definition: "Representational State Transfer - an API style using URLs for resources and HTTP methods for actions."}
  - {unit: SYS101-U2, kind: acronym, term: "HTTP", definition: "Hypertext Transfer Protocol - the request/response protocol of the web."}
  - {unit: SYS101-U2, kind: definition, term: "Idempotent", definition: "Doing it twice has the same effect as doing it once (GET, PUT, DELETE; not POST)."}
  - {unit: SYS101-U2, kind: definition, term: "Status code 401 vs 403", definition: "401 = not authenticated (who are you?); 403 = authenticated but not allowed."}
  - {unit: SYS101-U3, kind: acronym, term: "OPA", definition: "Open Policy Agent - an open-source engine that evaluates policies written in Rego."}
  - {unit: SYS101-U3, kind: definition, term: "Rego", definition: "OPA's declarative policy language for rules over JSON input."}
  - {unit: SYS101-U3, kind: definition, term: "Policy as code", definition: "Rules written as code so they're enforced automatically, versioned and tested."}
  - {unit: SYS101-U3, kind: definition, term: "Least privilege", definition: "Give each user or program only the access it needs, nothing more."}
  - {unit: SYS101-U3, kind: definition, term: "Fail-safe default", definition: "Deny by default; grant access explicitly."}
  - {unit: SYS101-U3, kind: definition, term: "Separation of duties", definition: "No single person can complete a sensitive action alone."}
  - {unit: SYS101-U3, kind: acronym, term: "CIA triad", definition: "Confidentiality, Integrity, Availability - the three goals of information security."}
  - {unit: SYS101-U4, kind: acronym, term: "IaC", definition: "Infrastructure as Code - defining infrastructure in version-controlled files."}
  - {unit: SYS101-U4, kind: definition, term: "Terraform state", definition: "The record mapping your configuration to real resources."}
  - {unit: SYS101-U4, kind: definition, term: "Drift", definition: "When real infrastructure no longer matches the code that defines it."}
  - {unit: SYS101-U4, kind: definition, term: "Provider (Terraform)", definition: "A plugin that lets Terraform manage a platform's resources (e.g. AWS)."}
  - {unit: SYS101-U4, kind: definition, term: "Preventive vs detective control", definition: "Preventive stops a problem before it happens; detective finds it afterwards."}
  - {unit: SYS101-U4, kind: acronym, term: "GRC", definition: "Governance, Risk and Compliance."}
  - {unit: SYS101-U4, kind: acronym, term: "ISMS", definition: "Information Security Management System - the ISO 27001 framework of policies, risks and controls."}
  - {unit: SYS101-U4, kind: acronym, term: "SoA", definition: "Statement of Applicability - ISO 27001 document listing which Annex A controls apply and why."}
  - {unit: SYS101-U4, kind: acronym, term: "TSC", definition: "Trust Services Criteria - the AICPA criteria for SOC 2: security, availability, processing integrity, confidentiality, privacy."}
  - {unit: SYS101-U4, kind: definition, term: "SOC 2 Type I vs Type II", definition: "Type I: controls are designed properly at a point in time. Type II: they operated effectively over a period."}
  - {unit: SYS101-U4, kind: definition, term: "ISO 27001:2022 Annex A", definition: "93 controls in four themes: organizational, people, physical, technological."}
  - {unit: SYS101-U4, kind: acronym, term: "NIST CSF 2.0 functions", definition: "Govern, Identify, Protect, Detect, Respond, Recover."}
  - {unit: SYS101-U4, kind: acronym, term: "RTO / RPO", definition: "Recovery Time Objective (how fast you must be back) / Recovery Point Objective (how much data you can lose)."}
