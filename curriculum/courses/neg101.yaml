course: NEG101
units:
  - key: NEG101-U1
    title: "Preparation: BATNA, walk-away and the zone of agreement"
    mode: studio
    weeks: "1-3"
    objectives:
      - Define your BATNA before every negotiation
      - Set a reservation (walk-away) price and an aspiration price
      - Estimate the other side's alternatives and the ZOPA
    sources: [fisher_ury, malhotra, pon]
    learn: >-
      Your power comes from your alternatives. Your BATNA is what you'll do if this deal fails - for a ski, it's the
      next-best listing. Your walk-away comes from your BATNA and your numbers; your aspiration is the ambitious but
      defensible target. The ZOPA exists only if your walk-away is above the seller's.
    key_points:
      - BATNA = best alternative if no deal
      - Reservation price = walk-away; aspiration = ambitious target
      - ZOPA exists only when walk-aways overlap
      - Improve your BATNA before the negotiation, not during
    apply: "Before your next ski negotiation, write your BATNA, walk-away and aspiration (the Deals page gives you numbers)."
    deliverable: "One prep sheet used in a real negotiation, logged in the Deals offer log."
    quiz:
      - q: "You're negotiating for a ski. Another seller has a similar ski you could buy for $4,300. That ski is your…"
        choices: ["ZOPA", "BATNA", "Anchor", "Aspiration price"]
        answer: 1
        why: "Your Best Alternative To a Negotiated Agreement."
      - q: "Your walk-away is $4,400. The seller's lowest acceptable price is $4,600. What is the ZOPA?"
        choices: ["$4,400-$4,600", "There is none", "$4,600 and up", "$4,400 and below"]
        answer: 1
        why: "A ZOPA exists only when the buyer's maximum is at or above the seller's minimum."
  - key: NEG101-U2
    title: "Anchors and first offers"
    mode: studio
    weeks: "4-6"
    objectives:
      - Explain why first offers anchor outcomes
      - Use precise numbers and justified ranges
      - Defend against the other side's anchor
    sources: [galinsky2001, mason2013, ames2015, tversky1974]
    learn: >-
      First offers pull final prices toward them (Galinsky & Mussweiler). Precise offers ($3,525) draw smaller
      counter-moves than round ones ($3,500) because they signal research (Mason et al.). A range whose low end is your
      target can help without hurting the relationship (Ames & Mason). Against their anchor: focus on your own
      alternatives and their reservation price, not their number.
    key_points:
      - First offers anchor outcomes
      - Precise numbers signal homework and draw smaller counteroffers
      - Counter an anchor by focusing on alternatives and their walk-away
      - Justify your number with evidence (inspection findings)
    apply: "Make one real first offer using a precise number justified by inspection findings."
    deliverable: "The offer, their response and the outcome - recorded in the offer log or evening-check ask."
    quiz:
      - q: "According to Mason et al. (2013), compared with a round first offer, a precise one tends to…"
        choices: ["insult the other side", "draw a more conciliatory counteroffer", "make no difference", "end talks sooner"]
        answer: 1
        why: "Precise numbers are read as informed, so counteroffers move less."
      - q: "The seller opens at $5,800 for a ski worth about $4,500. Best response?"
        choices: ["Split the difference", "Re-anchor using your evidence and alternatives", "Accept to avoid conflict",
                  "Match their number with $3,200 without explanation"]
        answer: 1
        why: "Shift focus to evidence and your BATNA; don't negotiate from their anchor."
  - key: NEG101-U3
    title: "Tactical empathy: labels, mirrors and calibrated questions"
    mode: studio
    weeks: "7-9"
    objectives:
      - Use labeling and mirroring to get information
      - Ask calibrated 'how' and 'what' questions
      - Run an accusation audit before a tough ask
    sources: [voss, pon]
    learn: >-
      People share more when they feel understood. Label emotions ("It sounds like you've had a lot of lowball offers"),
      mirror their last few words to invite more, and ask calibrated questions ("How am I supposed to do that?") that
      make the other side solve your problem. An accusation audit names the negatives first.
    key_points:
      - Label = name what they feel
      - Mirror = repeat their last 1-3 words
      - Calibrated questions start with how or what
      - Accusation audit defuses objections early
    apply: "Use three calibrated questions in real asks this unit and note what each produced."
    deliverable: "Three logged asks with the question used and the result."
    quiz:
      - q: "Which is a calibrated question?"
        choices: ["Can you lower the price?", "How am I supposed to do that at this price?", "Is that your best offer?",
                  "Will you take $4,000?"]
        answer: 1
        why: "Open 'how/what' questions invite the other side to solve the problem; yes/no questions invite a 'no'."
  - key: NEG101-U4
    title: "Concessions, walking away and learning from your reps"
    mode: studio
    weeks: "10-12"
    objectives:
      - Plan concessions that shrink in size
      - Walk away cleanly at your reservation price
      - Review your logged asks and change one thing
    sources: [malhotra, voss, fisher_ury]
    learn: >-
      Concessions that get smaller signal you're near your limit. Trade, don't give: every concession should get
      something (time, trailer, accessories). Walking away at your number protects you and is often what moves a seller.
      Improvement comes from reviewing real reps, not reading more.
    key_points:
      - Shrinking concessions signal your limit
      - Trade concessions for something
      - Walk away at your reservation price
      - Review reps; change one behavior
    apply: "Review every ask logged this semester (evening checks and offer logs): win rate, gains, one change."
    deliverable: "A short negotiation review with your numbers and one rule added to your rules page."
    quiz:
      - q: "Which concession pattern best signals you're reaching your limit?"
        choices: ["$300, then $300, then $300", "$400, then $150, then $50", "$50, then $400", "One big final concession"]
        answer: 1
        why: "Decreasing steps tell the other side the room is running out."
cards:
  - {unit: NEG101-U1, kind: acronym, term: "BATNA", definition: "Best Alternative To a Negotiated Agreement - what you'll do if this deal fails."}
  - {unit: NEG101-U1, kind: acronym, term: "ZOPA", definition: "Zone Of Possible Agreement - the overlap between both sides' walk-away points."}
  - {unit: NEG101-U1, kind: definition, term: "Reservation price", definition: "Your walk-away point - the worst deal you'll accept."}
  - {unit: NEG101-U1, kind: definition, term: "Aspiration price", definition: "Your ambitious but defensible target outcome."}
  - {unit: NEG101-U1, kind: definition, term: "Interests vs positions", definition: "Positions are what people ask for; interests are why. Deals are found in interests."}
  - {unit: NEG101-U2, kind: definition, term: "Anchor", definition: "A first number that pulls the final outcome toward it."}
  - {unit: NEG101-U2, kind: definition, term: "Precise offer", definition: "A specific number (e.g. $3,525) that signals research and draws smaller counteroffers."}
  - {unit: NEG101-U2, kind: definition, term: "Range offer", definition: "Offering a span; works best when the low end is your actual target."}
  - {unit: NEG101-U2, kind: definition, term: "Anchoring bias", definition: "The tendency to rely too heavily on the first number encountered (Tversky & Kahneman, 1974)."}
  - {unit: NEG101-U3, kind: definition, term: "Tactical empathy", definition: "Understanding and naming the other side's perspective to gain information and trust."}
  - {unit: NEG101-U3, kind: definition, term: "Labeling", definition: "Naming the other person's emotion: 'It seems like…'."}
  - {unit: NEG101-U3, kind: definition, term: "Mirroring", definition: "Repeating the last one to three words someone said to encourage them to keep talking."}
  - {unit: NEG101-U3, kind: definition, term: "Calibrated question", definition: "An open 'how' or 'what' question that makes the other side solve your problem."}
  - {unit: NEG101-U3, kind: definition, term: "Accusation audit", definition: "Listing the negatives they might think about you before they say them."}
  - {unit: NEG101-U4, kind: acronym, term: "MESO", definition: "Multiple Equivalent Simultaneous Offers - several packages of equal value to you, to learn their priorities."}
  - {unit: NEG101-U4, kind: definition, term: "Distributive negotiation", definition: "Dividing a fixed pie - one side's gain is the other's loss (e.g. price only)."}
  - {unit: NEG101-U4, kind: definition, term: "Integrative negotiation", definition: "Creating value by trading on different priorities (price for pickup timing, trailer, accessories)."}
  - {unit: NEG101-U4, kind: definition, term: "Logrolling", definition: "Trading concessions on issues you care less about for ones you care more about."}
